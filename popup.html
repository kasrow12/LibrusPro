<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/styles/popup.css" />
  </head>
  <body>
    <div>
      <div class="logo-container">
        <img src="img/icon.png" class="logo" />
        <div class="title">
          LibrusPro
          <div class="sub-title">
            Made with ❤️ by:
            <div class="author">Maks&nbsp;Kowalski</div>
          </div>
        </div>
      </div>
      <div class="quote">Ulepsz Librusa już dziś!</div>
    </div>
    <form id="form">
      <h1 class="options-title">Ustawienia rozszerzenia</h1>
      <div class="options-categories">
        <input
          type="radio"
          name="option-selection"
          id="optionsGeneral"
          class="option-category-radio"
          checked
        />
        <label for="optionsGeneral" class="option-category"
          >Ogólne <span class="emoji">🌙</span></label
        >
        <input
          type="radio"
          name="option-selection"
          id="optionsSchedule"
          class="option-category-radio"
        />
        <label for="optionsSchedule" class="option-category"
          >Terminarz <span class="emoji">📆</span></label
        >
        <input
          type="radio"
          name="option-selection"
          id="optionsGrades"
          class="option-category-radio"
        />
        <label for="optionsGrades" class="option-category"
          >Oceny <span class="emoji">🎓</span></label
        >
      </div>
      <div class="options" id="optionsGeneralElement" style="display: block">
        <label class="option-container">
          Ciemny motyw
          <input
            class="tgl tgl-light"
            id="darkTheme"
            type="checkbox"
            checked="true"
          />
          <label class="tgl-btn" for="darkTheme"></label>
        </label>
        <label class="option-container">
          Modernizacja dymków
          <input
            class="tgl tgl-light"
            id="modernizeTitles"
            type="checkbox"
            checked="true"
          />
          <label class="tgl-btn" for="modernizeTitles"></label>
        </label>
        <label class="option-container">
          Modyfikacja ocen
          <input
            class="tgl tgl-light"
            id="enableGradeManager"
            type="checkbox"
            checked="true"
          />
          <label class="tgl-btn" for="enableGradeManager"></label>
        </label>
        <label class="option-container">
          Wersja depresyjna
          <input class="tgl tgl-light" id="depressionMode" type="checkbox" />
          <label class="tgl-btn" for="depressionMode"></label>
        </label>
        <label class="option-container">
          Tryb incognito (do screenów)
          <input class="tgl tgl-light" id="incognitoMode" type="checkbox" />
          <label class="tgl-btn" for="incognitoMode"></label>
        </label>
        <label class="option-container">
          Ukrywanie I semestru
          <input class="tgl tgl-light" id="hideFirstTerm" type="checkbox" />
          <label class="tgl-btn" for="hideFirstTerm"></label>
        </label>
        <button class="button small" id="changelog">Co nowego?</button>
      </div>
      <div class="options" id="optionsScheduleElement">
        <label class="option-container">
          Modernizacja kafelków
          <input
            class="tgl tgl-light"
            id="modernizeSchedule"
            type="checkbox"
            checked="true"
          />
          <label class="tgl-btn" for="modernizeSchedule"></label>
        </label>
        <label class="option-container">
          Dodawanie opisów
          <input
            class="tgl tgl-light"
            id="addDescriptions"
            type="checkbox"
            checked="true"
          />
          <label class="tgl-btn" for="addDescriptions"></label>
        </label>
        <label class="option-container">
          Dodawanie planu lekcji
          <input
            class="tgl tgl-light"
            id="insertTimetable"
            type="checkbox"
            checked="true"
          />
          <label class="tgl-btn" for="insertTimetable"></label>
        </label>
        <label class="option-container">
          Ukrywanie klasy
          <input
            class="tgl tgl-light"
            id="removeClasses"
            type="checkbox"
            checked="true"
          />
          <label class="tgl-btn" for="removeClasses"></label>
        </label>
        <label class="option-container">
          Nieobecności nauczycieli
          <input
            class="tgl tgl-light"
            id="showTeacherFreeDays"
            type="checkbox"
            checked="true"
          />
          <label class="tgl-btn" for="showTeacherFreeDays"></label>
        </label>
      </div>
      <div class="options" id="optionsGradesElement">
        <label class="option-container">
          Liczenie średnich
          <input
            class="tgl tgl-light"
            id="calculateAverages"
            type="checkbox"
            checked="true"
          />
          <label class="tgl-btn" for="calculateAverages"></label>
        </label>
        <label class="option-container">
          Ukrywanie przedmiotów
          <input
            class="tgl tgl-light"
            id="hideSubjects"
            type="checkbox"
            checked="true"
          />
          <label class="tgl-btn" for="hideSubjects"></label>
        </label>
        <label class="option-container">
          Zera do średniej
          <input
            class="tgl tgl-light"
            id="countZeros"
            type="checkbox"
            checked="true"
          />
          <label class="tgl-btn" for="countZeros"></label>
        </label>
        <label class="option-container">
          Ukrywanie jedynek
          <input class="tgl tgl-light" id="hideOnes" type="checkbox" />
          <label class="tgl-btn" for="hideOnes"></label>
        </label>
        <label class="option-container">
          Mruganie zagrożeń
          <input class="tgl tgl-light" id="keepBlinker" type="checkbox" />
          <label class="tgl-btn" for="keepBlinker"></label>
        </label>
        <label class="option-container">
          <div>
            Wymuś liczenie
            <div class="description">(Licz do średniej: nie)</div>
          </div>
          <input class="tgl tgl-light" id="countToAverage" type="checkbox" />
          <label class="tgl-btn" for="countToAverage"></label>
        </label>
        <label class="option-container">
          <div>
            Wartość plusa
            <div class="description">np. 5+&nbsp;&nbsp;=&nbsp;&nbsp;5,50</div>
          </div>
          <input
            type="number"
            id="plusValue"
            name="plusValue"
            min="0"
            max="1"
            value="0.5"
            step="0.001"
          />
        </label>
        <label class="option-container">
          <div>
            Wartość minusa
            <div class="description">np. 5-&nbsp;&nbsp;=&nbsp;&nbsp;4,75</div>
          </div>
          <input
            type="number"
            id="minusValue"
            name="minusValue"
            min="0"
            max="1"
            value="0.25"
            step="0.001"
          />
        </label>
        <label class="option-container">
          <div>
            Średnia na 2
            <div class="description">do liczenia jedynek</div>
          </div>
          <input
            type="number"
            id="averageValue"
            name="averageValue"
            min="1"
            max="6"
            value="1.80"
            step="0.01"
          />
        </label>
      </div>
      <div class="buttons">
        <button class="button" id="saveButton">Zapisz</button>
        <button class="button" id="resetButton">Przywróć domyślne</button>
      </div>
    </form>
    <div class="footer">
      <div class="copyright">© <span id="copyrightYear"></span></div>
      <a
        href="https://chrome.google.com/webstore/detail/libruspro-rozszerzenie-do/hoceldjnkcboafconokadmmbijbegdkf/reviews"
        target="_blank"
        class="footer-link"
        >Zostaw 5<span style="font-size: 11px">⭐</span></a
      >
      <a
        class="footer-link"
        target="_blank"
        href="https://discord.gg/e9EkVEvsDr"
        >Discord</a
      >
      <div class="version" id="debugButton">v<span id="ver"></span></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
